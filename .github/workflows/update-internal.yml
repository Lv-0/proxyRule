name: Update Proxy Rule Groups

# Manual trigger: 2026-07-26T06:04:27+08:00
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-internal.yml"
  schedule:
    # 08:00 Asia/Shanghai = 00:00 UTC
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-proxy.list-rule-groups
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Aggregate and deduplicate rule groups
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import sys

          groups = {
              "Internal.list": [
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/AliPay/AliPay.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Alibaba/Alibaba.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/BiliBili/BiliBili.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/DouYin/DouYin.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/XiaoHongShu/XiaoHongShu.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/WeChat/WeChat.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Tencent/Tencent.list",
                  "https://rawstatic.com/nexitallyy/ProxyRules/main/ApplePush.list",
                  "https://rawstatic.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/GameDownload/GameDownload.list",
                  "https://rawstatic.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list",
                  "https://rawstatic.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list",
                  "https://www.naiixi.com/Extra_CN.list",
                  "https://www.naiixi.com/Extra_CN_2.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/iQIYI/iQIYI.list",
              ],
              "ai.list": [
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Gemini/Gemini.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Twitter/Twitter.list",
                  "https://rawstatic.com/nexitallyy/ProxyRules/main/Extra_AI.list",
              ],
              "proxy.list": [
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/GitHub/GitHub.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTube/YouTube.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/AppleMusic/AppleMusic.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Reddit/Reddit.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Tmdb/Tmdb.list",
                  "https://rawstatic.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list",
                  "https://rawstatic.com/HotKids/Rules/master/Surge/RULE-SET/Netflix.list",
                  "https://rawstatic.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list",
                  "https://rawstatic.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.list",
                  "https://www.naiixi.com/DisneyPlus.list",
                  "https://rawstatic.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Oracle/Oracle.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Jetbrains/Jetbrains.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/LinkedIn/LinkedIn.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Notion/Notion.list",
                  "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Nvidia/Nvidia.list",
              ],
          }

          def fetch_text(url: str) -> str:
              print(f"Fetching {url}")
              req = Request(url, headers={"User-Agent": "GitHub Actions"})
              try:
                  with urlopen(req, timeout=60) as response:
                      return response.read().decode("utf-8")
              except Exception as exc:
                  print(f"Failed to fetch {url}: {exc}", file=sys.stderr)
                  raise

          for output_path, urls in groups.items():
              seen = set()
              rules = []

              for url in urls:
                  for raw_line in fetch_text(url).splitlines():
                      line = raw_line.strip()
                      if not line or line.startswith("#"):
                          continue
                      if line not in seen:
                          seen.add(line)
                          rules.append(line)

              Path(output_path).write_text("\n".join(rules) + ("\n" if rules else ""), encoding="utf-8")
              print(f"Wrote {len(rules)} unique rules to {output_path}")
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          if git diff --quiet -- Internal.list ai.list proxy.list; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Internal.list ai.list proxy.list
          git commit -m "chore: update proxy rule groups"
          git push
